name: Morning Weather Report

on:
  schedule:
    - cron: '0 5 * * *'
      timezone: "America/New_York"
  push:
    branches:
       - main
  workflow_dispatch: {}   # allows manual "Run workflow" trigger from the Actions tab for testing

jobs:
  send-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run weather script
        run: python main.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          KRUTARTH_PHONE: ${{ secrets.KRUTARTH_PHONE }}
          KRUTARTH_CALLMEBOT_KEY: ${{ secrets.KRUTARTH_CALLMEBOT_KEY }}
          # JANKI_PHONE: ${{ secrets.JANKI_PHONE }}
          # JANKI_CALLMEBOT_KEY: ${{ secrets.JANKI_CALLMEBOT_KEY }}
